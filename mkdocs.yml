site_name: FSI Agent Governance Framework
site_description: "Governance framework for Microsoft 365 AI agents (Copilot Studio, Agent Builder) in Financial Services"
site_author: "FSI Agent Governance Team"
site_url: "https://judeper.github.io/FSI-AgentGov/"
repo_url: https://github.com/judeper/FSI-AgentGov
repo_name: judeper/FSI-AgentGov
# NOTE: Disclaimer link rendered by overrides/partials/copyright.html
# (Phase 3 AS14 / F-DEPLOY-COPYRIGHT-PATH-01). Do NOT add an `<a href>`
# back here — hardcoded URLs 404 under any mount point other than
# /FSI-AgentGov/. To change the disclaimer link target, edit the partial.
copyright: 'Copyright 2026 FSI Agent Governance Team'

extra:
  generator: false
  version: v1.6.2
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/judeper/FSI-AgentGov
      name: FSI Agent Governance on GitHub

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - announce.dismiss
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      separator: '[\s\-_,:!=\[\]()"/]+|\.(?!\d)|&[lg]t;'
  - include-markdown

# Site-wide link validation (MkDocs 1.6+). CI runs `mkdocs build --strict`, so any warnings here will fail the build.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn

# Auto-generated per-role homework pages: only the top 8 roles are in
# primary nav; the long-tail ~140 are reachable by URL/search.

# Exclude files that are intentionally not in navigation
#
# `images/*/EXPECTED.md` excludes the per-control screenshot
# verification specs (78 files, internal docs only — never customer-
# facing). The `images/diagrams/` tree is NOT excluded; it ships the
# exportable architecture diagrams referenced by ~30+ "Download
# diagram" links across the docs.
#
# Note: gitignore re-include semantics (`!images/diagrams/`) cannot
# rescue paths whose parent directory is excluded, so we exclude the
# specific files instead of negating-around a directory exclusion.
# See F-IMAGES-EXCLUDED-* (Phase 3 AS2).
exclude_docs: |
  images/.gitignore
  images/*/EXPECTED.md
  scripts/
  templates/
  javascripts/lib/VENDOR-MANIFEST.md

not_in_nav: |
  playbooks/_shared/
  /assessment/pre-session/**
  images/diagrams/source/cape/**
  controls/CONTROL-INDEX.md
  reference/raci-matrix.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      # `to_svg` would generate <img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@.../assets/svg/{cp}.svg">
      # which is blocked by our CSP `img-src 'self' data:` (supply-chain
      # hardening for the FSI audience). `to_alt` emits the Unicode
      # codepoint as plain text — the browser then renders it via the OS
      # color emoji font (Segoe UI Emoji on Windows, Apple Color Emoji on
      # macOS, Noto Color Emoji on Linux/Android). No network, no CSP
      # loosening, and screen readers announce the emoji semantically.
      # See F-TWEMOJI-CSP-IMG-BLOCK-01 (Phase 3 AS1B).
      emoji_generator: !!python/name:pymdownx.emoji.to_alt

extra_css:
  - stylesheets/extra.css
  - stylesheets/control-explorer.css
  - stylesheets/feedback.css
  - stylesheets/print.css
  - stylesheets/search-helper.css
  - stylesheets/control-bluf.css

extra_javascript:
  - javascripts/assessment-loader.js
  - javascripts/a11y.js
  - javascripts/control-explorer.js
  - javascripts/feedback.js
  - javascripts/print-control.js
  - javascripts/search-helper.js
  - javascripts/control-bluf.js

hooks:
  - scripts/hooks/copy_assessment_data.py
  - scripts/hooks/generate_homework_pages_hook.py
  - overrides/hooks/cache_bust.py

