name: Microsoft Learn Documentation Monitor

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual triggering
  pull_request:
    # Fast offline smoke check (--dry-run) when the monitor scripts change
    paths:
      - 'scripts/learn_monitor.py'
      - 'scripts/monitoring_shared.py'
      - '.github/workflows/learn-monitor.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Serialize Learn Monitor runs so two runs never consolidate/auto-merge each
  # other's PRs.
  group: learn-monitor
  cancel-in-progress: false

jobs:
  monitor-learn-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pyyaml

      - name: Run Learn Monitor (PR smoke, dry-run)
        if: github.event_name == 'pull_request'
        run: python scripts/learn_monitor.py --dry-run

      - name: Run Learn Monitor
        id: monitor
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          AUTODOC_ENABLED: ${{ vars.AUTODOC_ENABLED }}
        run: |
          # Check if this is a baseline run (no prior state file)
          # Check for unified state file OR old state file (for migration)
          if [ ! -f "data/monitor-state.json" ] && [ ! -f "data/learn-monitor-state.json" ]; then
            echo "is_baseline=true" >> $GITHUB_OUTPUT
          else
            echo "is_baseline=false" >> $GITHUB_OUTPUT
          fi

          # Run the monitor and capture exit code
          # Disable set -e so exit code 1 (changes detected) doesn't abort the script
          set +e
          python scripts/learn_monitor.py
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # If changes were detected, extract summary stats from the report
          if [ "$EXIT_CODE" -eq 1 ]; then
            REPORT_FILE=$(ls -t reports/monitoring/learn-changes-*.md 2>/dev/null | head -1)
            if [ -n "$REPORT_FILE" ]; then
              # Extract counts from the report (format: | HIGH Changes | 24 |)
              MEANINGFUL=$(grep -oP 'HIGH Changes\s*\|\s*\K\d+' "$REPORT_FILE" 2>/dev/null || echo "0")
              MINOR=$(grep -oP 'MEDIUM Changes\s*\|\s*\K\d+' "$REPORT_FILE" 2>/dev/null || echo "0")
              REDIRECTS=$(grep -oP 'Redirects\s*\|\s*\K\d+' "$REPORT_FILE" 2>/dev/null || echo "0")
              ERRORS=$(grep -oP 'Errors\s*\|\s*\K\d+' "$REPORT_FILE" 2>/dev/null || echo "0")

              echo "meaningful_changes=$MEANINGFUL" >> $GITHUB_OUTPUT
              echo "minor_changes=$MINOR" >> $GITHUB_OUTPUT
              echo "redirects=$REDIRECTS" >> $GITHUB_OUTPUT
              echo "errors=$ERRORS" >> $GITHUB_OUTPUT
              echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT

              # Extract HIGH priority change titles (first 10)
              HIGH_CHANGES=$(grep -A1 "^### [0-9]" "$REPORT_FILE" 2>/dev/null | grep -v "^--$" | head -20 || echo "")
              echo "high_changes<<EOF" >> $GITHUB_OUTPUT
              echo "$HIGH_CHANGES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Check if today is Sunday
        id: check_day
        if: github.event_name != 'pull_request'
        run: |
          if [ "$(date +%u)" -eq 7 ]; then
            echo "is_sunday=true" >> $GITHUB_OUTPUT
          else
            echo "is_sunday=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine if PR should be created
        id: should_create_pr
        if: github.event_name != 'pull_request'
        run: |
          # Create PR if it's Sunday (weekly baseline) OR if changes were detected (exit code 1)
          if [ "${{ steps.check_day.outputs.is_sunday }}" = "true" ] || [ "${{ steps.monitor.outputs.exit_code }}" = "1" ]; then
            echo "create_pr=true" >> $GITHUB_OUTPUT
          else
            echo "create_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate GitHub App token
        id: app-token
        if: steps.should_create_pr.outputs.create_pr == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: create_pr
        if: steps.should_create_pr.outputs.create_pr == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Only ever stage state/report files so the PR cannot accidentally
          # carry customer-facing docs into the unattended auto-merge path.
          add-paths: |
            data/monitor-state.json
            data/monitor-state.json.backup
            data/monitor-pending/learn/*.json
            reports/monitoring/*.md
          commit-message: |
            Learn Monitor: Update Microsoft Learn documentation tracking

            - Updated baseline or detected changes in Microsoft Learn documentation
            - See reports/monitoring/ for detailed change reports
            - Automated update from learn-monitor workflow (unified monitoring framework)
          branch: monitoring/learn-${{ github.run_number }}
          delete-branch: true
          title: 'Learn Monitor: Microsoft Learn Documentation Update (${{ github.run_number }})'
          body: |
            ## Microsoft Learn Documentation Monitor

            ${{ steps.monitor.outputs.is_baseline == 'true' && '> **BASELINE RUN:** This is the first successful run. The state file establishes content hashes for all monitored URLs. No change reports are generated on baseline runs - future runs will compare against this baseline.' || 'This PR contains updates to Microsoft Learn documentation tracking.' }}

            ### What Changed

            - **Run Type:** ${{ steps.monitor.outputs.is_baseline == 'true' && 'Baseline (first run)' || (steps.monitor.outputs.exit_code == '1' && 'Changes detected' || 'Weekly update') }}
            - **Changes Detected:** ${{ steps.monitor.outputs.exit_code == '1' && 'Yes' || 'No' }}
            - **Run Number:** ${{ github.run_number }}
            - **Run Date:** ${{ github.event.repository.updated_at }}

            ${{ steps.monitor.outputs.exit_code == '1' && format('### Change Summary

            | Category | Count |
            |----------|-------|
            | **HIGH Priority** | {0} |
            | **MEDIUM Priority** | {1} |
            | **URL Redirects** | {2} |
            | **Errors** | {3} |', steps.monitor.outputs.meaningful_changes, steps.monitor.outputs.minor_changes, steps.monitor.outputs.redirects, steps.monitor.outputs.errors) || '' }}

            ### Review Instructions

            ${{ steps.monitor.outputs.is_baseline == 'true' && '1. Review `data/monitor-state.json` to verify URLs are being tracked
            2. Merge to establish baseline for future change detection' || '1. Check `reports/monitoring/` for detailed change reports (if changes detected)
            2. Review `data/monitor-state.json` for updated URLs and content hashes
            3. Verify changes are relevant to FSI-AgentGov documentation
            4. Update affected controls/playbooks if needed
            5. Merge to update baseline' }}

            ${{ steps.monitor.outputs.exit_code == '1' && '### 🤖 AI-Assisted Review Available

            To draft documentation updates based on this change report:

            ```bash
            # 1. Checkout this PR branch
            gh pr checkout ' || '' }}${{ steps.monitor.outputs.exit_code == '1' && github.run_number || '' }}${{ steps.monitor.outputs.exit_code == '1' && '

            # 2. Run the review skill in Claude Code
            /review-learn-changes

            # 3. Claude will analyze the change report and:
            #    - Categorize changes (update/flag/skip)
            #    - Propose specific documentation edits
            #    - Apply edits with your confirmation
            #    - Run validation (mkdocs build --strict)

            # 4. Commit and push the documentation updates
            git add .
            git commit -m "docs: Apply Learn Monitor updates"
            git push
            ```

            See [Learn Monitor AI Enhancement](docs/reference/learn-monitor-ai-enhancement.md) for details.' || '' }}

            ### Files Modified

            - `data/monitor-state.json` - ${{ steps.monitor.outputs.is_baseline == 'true' && 'Initial baseline with content hashes (unified state for all monitoring sources)' || 'Updated content hashes and metadata' }}
            ${{ steps.monitor.outputs.exit_code == '1' && '- `reports/monitoring/learn-changes-*.md` - Change detection reports with control-to-URL impact mapping' || '' }}

            ---

            *Automated PR created by `.github/workflows/learn-monitor.yml`*
          labels: |
            monitoring
            documentation
            automated
            learn-watch
            ${{ steps.monitor.outputs.exit_code == '1' && 'needs-review' || '' }}
          assignees: ${{ github.repository_owner }}

      - name: Add summary comment with HIGH priority changes
        if: steps.create_pr.outputs.pull-request-number && steps.monitor.outputs.exit_code == '1'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.create_pr.outputs.pull-request-number }}
          body: |
            ## 📋 HIGH Priority Changes Detected

            The following Microsoft Learn documentation changes may require updates to FSI-AgentGov controls or playbooks:

            <details>
            <summary>View ${{ steps.monitor.outputs.meaningful_changes }} HIGH priority changes</summary>

            See the full change report: `${{ steps.monitor.outputs.report_file }}`

            **Change Categories:**
            - 🔴 **DATE_UPDATE** - Timeline/deadline changed
            - 🟠 **UI_CHANGE** - Portal navigation or button names changed
            - 🟡 **FEATURE_GA** - Feature moved to General Availability
            - 🟣 **DEPRECATION** - Feature deprecated or retired
            - 🔵 **NEW_DOC** - New documentation page added
            - ⚪ **URL_REDIRECT** - URL path changed

            </details>

            ---

            ### Quick Actions

            | Action | Command |
            |--------|---------|
            | Checkout PR | `gh pr checkout ${{ steps.create_pr.outputs.pull-request-number }}` |
            | Run AI-assisted review | `/review-learn-changes` |
            | View change report | Open `${{ steps.monitor.outputs.report_file }}` |
            | Merge without changes | Approve and merge this PR |

            > 💡 **Tip:** Run `/review-learn-changes` in Claude Code to automatically analyze changes and draft documentation updates.

      # --- Stage 0: consolidation + auto-merge of state-only monitoring PRs ---
      # Learn-monitor PRs only ever touch data/monitor-state.json(.backup),
      # data/monitor-pending/learn/*.json, and reports/monitoring/*.md (no customer-facing docs). The newest run carries
      # the cumulative monitor-state.json baseline, so prior daily PRs are
      # superseded and safe to close; the newest is safe to auto-merge once the
      # required checks pass. See docs/reference/learn-monitor-guide.md.
      - name: Consolidate superseded Learn-monitor PRs
        # Gated by the same kill-switch as auto-merge: turning automation off
        # disables this destructive (PR-closing) step too.
        if: steps.create_pr.outputs.pull-request-number && vars.LEARN_STATE_AUTOMERGE == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_PR: ${{ steps.create_pr.outputs.pull-request-number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Close ONLY older bot-created monitoring PRs: they must carry the
          # `learn-watch` label, match the exact branch pattern
          # `monitoring/learn-<digits>`, and have a run number strictly lower than
          # this run. This prevents closing human PRs that merely share the prefix
          # and prevents two runs from closing each other.
          gh pr list --state open --label learn-watch --json number,headRefName \
            --jq '.[] | select(.headRefName | test("^monitoring/learn-[0-9]+$")) | "\(.number) \(.headRefName)"' \
          | while read -r n branch; do
              run="${branch#monitoring/learn-}"
              if [ "$n" != "$NEW_PR" ] && [ "$run" -lt "$RUN_NUMBER" ]; then
                echo "Closing superseded PR #$n (run $run < $RUN_NUMBER)"
                gh pr close "$n" --delete-branch \
                  --comment "Superseded by #${NEW_PR}, which carries the cumulative \`data/monitor-state.json\` baseline (run ${RUN_NUMBER} > ${run}). Auto-closed by the Learn Monitor consolidation step." || true
              fi
            done

      - name: Enable auto-merge for the state-only PR
        # Kill-switch: set repo variable LEARN_STATE_AUTOMERGE to 'false' (or unset)
        # to disable unattended merging of monitoring PRs.
        if: steps.create_pr.outputs.pull-request-number && vars.LEARN_STATE_AUTOMERGE == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_PR: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          # Defense in depth: only auto-merge if EVERY changed file is a
          # state/report file. Use the paginated REST API because
          # `gh pr view --json files` truncates at 100 files, so an extra file
          # beyond the first page could otherwise slip through undetected.
          # Fail CLOSED: if the file listing can't be obtained, skip auto-merge.
          FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NEW_PR}/files" --paginate --jq '.[].filename') || FILES=""
          if [ -z "$FILES" ]; then
            echo "::warning::Could not list files for PR #$NEW_PR (API error or empty); skipping auto-merge (manual review required)."
            gh pr edit "$NEW_PR" --add-label needs-review || true
            exit 0
          fi
          NON_STATE=$(printf '%s\n' "$FILES" \
            | grep -vcE '^data/monitor-state\.json(\.backup)?$|^data/monitor-pending/learn/[^/]+\.json$|^reports/monitoring/.*\.md$' || true)
          if [ "${NON_STATE:-1}" != "0" ]; then
            echo "::warning::PR #$NEW_PR contains non-state file(s) (count=${NON_STATE:-unknown}); skipping auto-merge (manual review required)."
            gh pr edit "$NEW_PR" --add-label needs-review || true
            exit 0
          fi
          gh pr merge "$NEW_PR" --auto --squash --delete-branch
          echo "Auto-merge enabled for state-only PR #$NEW_PR (merges once required checks pass)."
