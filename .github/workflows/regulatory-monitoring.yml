name: Regulatory Monitor

on:
  push:
    paths:
      - 'scripts/regulatory_monitor.py'
      - 'scripts/monitoring_shared.py'
      - '.github/workflows/regulatory-monitoring.yml'
  pull_request:
    paths:
      - 'scripts/regulatory_monitor.py'
      - 'scripts/monitoring_shared.py'
      - '.github/workflows/regulatory-monitoring.yml'
  schedule:
    # Run weekly on Mondays at 7:00 AM UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Serialize Regulatory Monitor runs so two runs never consolidate/auto-merge
  # each other's PRs.
  group: regulatory-monitor
  cancel-in-progress: false

jobs:
  monitor-regulatory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pyyaml

      - name: Run Regulatory Monitor (PR smoke, dry-run)
        if: github.event_name == 'pull_request'
        run: python scripts/regulatory_monitor.py --dry-run

      - name: Run Regulatory Monitor (non-default ref, read-only dry validation)
        if: github.event_name != 'pull_request' && github.ref_name != github.event.repository.default_branch
        run: |
          # Feature branches and manual runs on non-default refs may validate
          # monitor code, but must never mutate state or create state PRs.
          python scripts/regulatory_monitor.py --dry-run

      - name: Run Regulatory Monitor
        id: monitor
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE_SHA=$(git rev-parse HEAD)
          STATE_SHA_BEFORE=$(sha256sum data/monitor-state.json | awk '{print $1}')
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "state_sha_before=$STATE_SHA_BEFORE" >> "$GITHUB_OUTPUT"

          # Run the monitor and capture exit code
          # Disable set -e so exit code 1 (changes detected) doesn't abort the script
          set +e
          python scripts/regulatory_monitor.py
          EXIT_CODE=$?
          set -e
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          # Exit 0 is still a successful run: the monitor may have advanced
          # refresh cursors, last_run metadata, or learned FINRA fallbacks.
          # Those state-only updates must be persisted just like findings.
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "automerge_eligible=true" >> $GITHUB_OUTPUT
            echo "run_kind=state-maintenance" >> $GITHUB_OUTPUT
            echo "critical_items=0" >> $GITHUB_OUTPUT
            echo "high_items=0" >> $GITHUB_OUTPUT
            echo "medium_items=0" >> $GITHUB_OUTPUT
            echo "noise_items=0" >> $GITHUB_OUTPUT
          fi

          # If changes were detected, extract summary stats from the report
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "run_kind=findings" >> $GITHUB_OUTPUT
            REPORT_FILE=$(ls -t reports/monitoring/regulatory-changes-*.md 2>/dev/null | head -1)
            if [ -n "$REPORT_FILE" ]; then
              # Extract counts from the report. Use `| head -1 || true` (NOT
              # `|| echo 0`) so a grep miss / PCRE-unavailable / report-format
              # drift yields an EMPTY string rather than "0".
              CRITICAL=$(grep -oP 'CRITICAL Changes.*?\K\d+' "$REPORT_FILE" 2>/dev/null | head -1 || true)
              HIGH=$(grep -oP 'HIGH Changes.*?\K\d+' "$REPORT_FILE" 2>/dev/null | head -1 || true)
              MEDIUM=$(grep -oP 'MEDIUM Changes.*?\K\d+' "$REPORT_FILE" 2>/dev/null | head -1 || true)
              NOISE=$(grep -oP 'NOISE Changes.*?\K\d+' "$REPORT_FILE" 2>/dev/null | head -1 || true)

              # FAIL-CLOSED auto-merge eligibility, computed from the RAW counts
              # BEFORE any display fallback. Only 'true' when BOTH CRITICAL and HIGH
              # parsed as exactly "0". An empty value (parse failure / format drift)
              # is NOT "0", so it can never present as "0 critical/high" and slip an
              # unreviewed item through the unattended auto-merge gate.
              if [ "$CRITICAL" = "0" ] && [ "$HIGH" = "0" ]; then
                echo "automerge_eligible=true" >> $GITHUB_OUTPUT
              else
                echo "automerge_eligible=false" >> $GITHUB_OUTPUT
              fi

              # Display counts (PR title/body): empty -> 0 for readable output only.
              echo "critical_items=${CRITICAL:-0}" >> $GITHUB_OUTPUT
              echo "high_items=${HIGH:-0}" >> $GITHUB_OUTPUT
              echo "medium_items=${MEDIUM:-0}" >> $GITHUB_OUTPUT
              echo "noise_items=${NOISE:-0}" >> $GITHUB_OUTPUT
              echo "report_file=$REPORT_FILE" >> $GITHUB_OUTPUT
            fi
          fi

          # Exit codes 2+ are fail-closed source/validation errors. Preserve
          # the report outputs above, then surface the error to the guard step.
          if [ "$EXIT_CODE" -ge 2 ]; then
            echo "::error::Regulatory monitor failed closed with exit code $EXIT_CODE" >&2
            exit "$EXIT_CODE"
          fi

      - name: Detect persisted monitor changes
        id: state_changes
        if: >-
          github.event_name != 'pull_request' &&
          github.ref_name == github.event.repository.default_branch &&
          (steps.monitor.outputs.exit_code == '0' ||
          steps.monitor.outputs.exit_code == '1')
        run: |
          set -euo pipefail

          # The monitor is allowed to change only its state/backup and
          # regulatory report outputs. Any other mutation is a fail-closed
          # workflow error rather than an accidental PR payload.
          ALLOWED_PATHS='^(data/monitor-state\.json(\.backup)?|reports/monitoring/regulatory-changes-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md)$'
          CHANGED_PATHS=$(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //')
          if [ -n "$CHANGED_PATHS" ]; then
            UNEXPECTED_PATHS=$(printf '%s\n' "$CHANGED_PATHS" | grep -vE "$ALLOWED_PATHS" || true)
            if [ -n "$UNEXPECTED_PATHS" ]; then
              echo "::error::Unexpected monitor mutation(s):"
              printf '%s\n' "$UNEXPECTED_PATHS" >&2
              exit 2
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_paths<<EOF" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$CHANGED_PATHS" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate default-branch monitor CAS
        id: cas
        if: >-
          github.event_name != 'pull_request' &&
          github.ref_name == github.event.repository.default_branch &&
          (steps.monitor.outputs.exit_code == '0' ||
          steps.monitor.outputs.exit_code == '1')
        run: |
          set -euo pipefail
          EXPECTED_BASE="${{ steps.monitor.outputs.base_sha }}"
          EXPECTED_STATE="${{ steps.monitor.outputs.state_sha_before }}"
          CURRENT_BASE=$(git rev-parse HEAD)
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

          if [ "${GITHUB_REF_NAME}" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Mutating monitor run is not on the default branch." >&2
            exit 2
          fi
          if [ "$CURRENT_BASE" != "$EXPECTED_BASE" ]; then
            echo "::error::Checked-out base changed during monitor execution." >&2
            exit 2
          fi

          git fetch --no-tags origin "$DEFAULT_BRANCH"
          REMOTE_BASE=$(git rev-parse "origin/$DEFAULT_BRANCH")
          if [ "$REMOTE_BASE" != "$EXPECTED_BASE" ]; then
            echo "::error::Default branch advanced during monitor execution; refusing state PR." >&2
            exit 2
          fi

          BASE_STATE=$(git show "$EXPECTED_BASE:data/monitor-state.json" | sha256sum | awk '{print $1}')
          if [ "$BASE_STATE" != "$EXPECTED_STATE" ]; then
            echo "::error::Captured state SHA does not match captured base commit; refusing state PR." >&2
            exit 2
          fi

          CURRENT_STATE=$(sha256sum data/monitor-state.json | awk '{print $1}')
          if [ -z "$EXPECTED_STATE" ] || [ -z "$CURRENT_STATE" ]; then
            echo "::error::Missing captured state SHA; refusing state PR." >&2
            exit 2
          fi
          echo "base_sha=$EXPECTED_BASE" >> "$GITHUB_OUTPUT"
          echo "state_sha_before=$EXPECTED_STATE" >> "$GITHUB_OUTPUT"
          echo "state_sha_after=$CURRENT_STATE" >> "$GITHUB_OUTPUT"
          echo "valid=true" >> "$GITHUB_OUTPUT"

      - name: Determine whether to create a monitor PR
        id: should_create_pr
        if: >-
          steps.cas.outputs.valid == 'true' &&
          (steps.monitor.outputs.exit_code == '0' ||
          steps.monitor.outputs.exit_code == '1')
        run: |
          set -euo pipefail
          EXIT_CODE="${{ steps.monitor.outputs.exit_code }}"
          STATE_CHANGED="${{ steps.state_changes.outputs.changed }}"

          # Findings always need a PR. A successful no-findings run needs one
          # only when it actually persisted monitor state; clean runs are silent.
          if [ "$EXIT_CODE" = "1" ] || { [ "$EXIT_CODE" = "0" ] && [ "$STATE_CHANGED" = "true" ]; }; then
            echo "create_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "create_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail on regulatory monitor error
        if: steps.monitor.outputs.exit_code != '' && steps.monitor.outputs.exit_code != '0' && steps.monitor.outputs.exit_code != '1'
        run: |
          echo "::error::Regulatory monitor failed closed with exit code ${{ steps.monitor.outputs.exit_code }}" >&2
          exit "${{ steps.monitor.outputs.exit_code }}"

      - name: Generate GitHub App token
        id: app-token
        if: >-
          steps.cas.outputs.valid == 'true' &&
          steps.should_create_pr.outputs.create_pr == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Pull Request
        id: create_pr
        if: >-
          steps.cas.outputs.valid == 'true' &&
          steps.should_create_pr.outputs.create_pr == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Only ever stage state/report files so the PR cannot accidentally carry
          # customer-facing docs into the unattended auto-merge path. The regulatory
          # monitor writes only data/monitor-state.json(.backup) and
          # reports/monitoring/regulatory-changes-*.md.
          add-paths: |
            data/monitor-state.json
            data/monitor-state.json.backup
            reports/monitoring/*.md
          commit-message: "Monitoring: Persist regulatory monitor state (${{ github.run_number }})"
          branch: monitoring/regulatory-${{ github.run_number }}
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          title: "Monitoring: ${{ steps.monitor.outputs.exit_code == '1' && 'regulatory findings detected' || 'successful state maintenance' }} (${{ github.run_number }})"
          body: |
            ## Regulatory Monitor Report

            **Run type:** ${{ steps.monitor.outputs.exit_code == '1' && 'Regulatory findings detected' || 'Successful state maintenance (no content findings)' }}

            ${{ steps.monitor.outputs.exit_code == '0' && 'This maintenance-only PR persists verified monitor progress (refresh cursors, timestamps, and learned source fallbacks) so the next run does not repeat the same batch.' || 'This PR contains new regulatory items detected from Federal Register (SEC, CFTC, OCC, Federal Reserve) and FINRA notices.' }}

            ### Change Summary

            | Category | Count |
            |----------|-------|
            | **CRITICAL** | ${{ steps.monitor.outputs.critical_items }} |
            | **HIGH Priority** | ${{ steps.monitor.outputs.high_items }} |
            | **MEDIUM Priority** | ${{ steps.monitor.outputs.medium_items }} |
            | **NOISE** | ${{ steps.monitor.outputs.noise_items }} |

            **Total New Items:** CRITICAL: ${{ steps.monitor.outputs.critical_items }}, HIGH: ${{ steps.monitor.outputs.high_items }}, MEDIUM: ${{ steps.monitor.outputs.medium_items }}, NOISE: ${{ steps.monitor.outputs.noise_items }}

            ### Next Steps

            ${{ steps.monitor.outputs.exit_code == '1' && format('1. Review the full report: `{0}`; 2. For CRITICAL/HIGH items, check suggested affected controls; 3. Update framework documentation if regulatory changes require it; 4. Merge to update baseline for future monitoring.', steps.monitor.outputs.report_file) || '1. Verify the diff contains only expected monitor-state, backup, and maintenance metadata changes; 2. Merge (or allow the guarded auto-merge) to persist progress for the next refresh batch.' }}

            ### Review Instructions

            **CRITICAL items** directly mention AI agents, copilot, or automated advice in FSI context.

            **HIGH items** reference AI, ML, automation, or FSI-specific requirements (FINRA 3110, SEC 17a-3/4, etc.).

            **MEDIUM items** are general FSI regulations that may indirectly affect AI agent deployments.

            **NOISE items** have no FSI AI agent governance relevance.

            ### Files Modified

            - `data/monitor-state.json` - Updated with new regulatory item hashes (unified state for all monitoring sources)
            ${{ steps.monitor.outputs.exit_code == '1' && format('- `{0}` - Detailed change report with control-to-keyword mapping', steps.monitor.outputs.report_file) || '- `data/monitor-state.json.backup` - Atomic rollback copy of the persisted state' }}

            ---

            *Automated PR created by `.github/workflows/regulatory-monitor.yml` (unified monitoring system)*
          labels: |
            monitoring
            regulatory
            ${{ steps.monitor.outputs.exit_code == '1' && 'needs-review' || '' }}
          assignees: ${{ github.repository_owner }}

      - name: Add summary comment with priority items
        if: steps.create_pr.outputs.pull-request-number && steps.monitor.outputs.exit_code == '1'
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.create_pr.outputs.pull-request-number }}
          body: |
            ## 📋 Priority Regulatory Changes Detected

            The following regulatory changes may require updates to FSI-AgentGov controls or playbooks:

            <details>
            <summary>View CRITICAL/HIGH priority items (${{ steps.monitor.outputs.critical_items }} critical, ${{ steps.monitor.outputs.high_items }} high)</summary>

            See the full change report: `${{ steps.monitor.outputs.report_file }}`

            **Classification Tiers:**
            - 🔴 **CRITICAL** - Directly mentions AI agents, copilot, or automated advice
            - 🟠 **HIGH** - References AI/ML/automation or FSI-specific requirements
            - 🟡 **MEDIUM** - General FSI regulations (indirect AI agent impact)
            - ⚪ **NOISE** - No FSI AI agent governance relevance

            </details>

            ---

            ### Quick Actions

            | Action | Command |
            |--------|---------|
            | Checkout PR | `gh pr checkout ${{ steps.create_pr.outputs.pull-request-number }}` |
            | View change report | Open `${{ steps.monitor.outputs.report_file }}` |
            | Merge without changes | Approve and merge this PR |

            > 💡 **Tip:** Review CRITICAL and HIGH items first. Check the "Potentially Affected Controls" section for keyword-based suggestions.

      # --- consolidation + auto-merge of state-only regulatory PRs ---
      # Regulatory PRs only ever touch data/monitor-state.json(.backup) and
      # reports/monitoring/*.md (no customer-facing docs). The newest run carries
      # the cumulative monitor-state.json baseline, so prior auto-merge-eligible
      # regulatory PRs are superseded and safe to close. PRs that still carry
      # `needs-review` (CRITICAL/HIGH items) are NEVER closed here — they are
      # preserved for human review. The newest is auto-merged ONLY when it has
      # zero CRITICAL/HIGH items.
      - name: Consolidate superseded Regulatory-monitor PRs
        # Gated by the same kill-switch as auto-merge: turning automation off
        # disables this destructive (PR-closing) step too. Closes ONLY
        # auto-merge-eligible (non-needs-review) superseded PRs; CRITICAL/HIGH PRs
        # keep their needs-review label and are left open for a human.
        if: >-
          steps.create_pr.outputs.pull-request-number &&
          steps.cas.outputs.valid == 'true' &&
          vars.REGULATORY_STATE_AUTOMERGE == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_PR: ${{ steps.create_pr.outputs.pull-request-number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Close ONLY older bot-created regulatory PRs that are auto-merge-eligible:
          # they must carry the `regulatory` label, NOT carry `needs-review`
          # (CRITICAL/HIGH PRs keep it and must stay open for a human), match the
          # exact branch pattern `monitoring/regulatory-<digits>`, and have a run
          # number strictly lower than this run. This avoids closing human PRs,
          # unreviewed CRITICAL/HIGH PRs, the current PR, or racing another run.
          gh pr list --state open --label regulatory --json number,headRefName,labels \
            --jq '.[] | select(.headRefName | test("^monitoring/regulatory-[0-9]+$")) | select(any(.labels[]; .name == "needs-review") | not) | "\(.number) \(.headRefName)"' \
          | while read -r n branch; do
              run="${branch#monitoring/regulatory-}"
              if [ "$n" != "$NEW_PR" ] && [ "$run" -lt "$RUN_NUMBER" ]; then
                echo "Closing superseded PR #$n (run $run < $RUN_NUMBER)"
                gh pr close "$n" --delete-branch \
                  --comment "Superseded by #${NEW_PR}, which carries the cumulative \`data/monitor-state.json\` baseline (run ${RUN_NUMBER} > ${run}). Auto-closed by the Regulatory Monitor consolidation step." || true
              fi
            done

      - name: Enable auto-merge for the state-only PR (no CRITICAL/HIGH items)
        # Kill-switch: set repo variable REGULATORY_STATE_AUTOMERGE to 'true' to
        # enable unattended merging of state-only regulatory PRs. Additionally
        # gated on the FAIL-CLOSED automerge_eligible signal (both CRITICAL and
        # HIGH positively parsed as 0); CRITICAL/HIGH or unparseable counts keep
        # the `needs-review` label for a human.
        if: >-
          steps.create_pr.outputs.pull-request-number &&
          steps.cas.outputs.valid == 'true' &&
          vars.REGULATORY_STATE_AUTOMERGE == 'true' &&
          steps.monitor.outputs.automerge_eligible == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_PR: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          # The PR must still be based on the exact default-branch commit
          # captured before the monitor ran. If main moved, leave it open for
          # guarded review rather than merging a mixed state baseline.
          EXPECTED_BASE="${{ steps.cas.outputs.base_sha }}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          PR_BASE=$(gh pr view "$NEW_PR" --json baseRefName,baseRefOid \
            --jq '"\(.baseRefName) \(.baseRefOid)"')
          read -r PR_BASE_NAME PR_BASE_SHA <<< "$PR_BASE"
          if [ "$PR_BASE_NAME" != "$DEFAULT_BRANCH" ] || [ "$PR_BASE_SHA" != "$EXPECTED_BASE" ]; then
            echo "::error::Maintenance PR base CAS mismatch; refusing auto-merge." >&2
            exit 2
          fi

          # Defense in depth: only auto-merge if EVERY changed file is a
          # state/report file. Use the paginated REST API because
          # `gh pr view --json files` truncates at 100 files. Fail CLOSED: if the
          # file listing can't be obtained, skip auto-merge.
          FILES=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NEW_PR}/files" --paginate --jq '.[].filename') || FILES=""
          if [ -z "$FILES" ]; then
            echo "::warning::Could not list files for PR #$NEW_PR (API error or empty); skipping auto-merge (manual review required)."
            gh pr edit "$NEW_PR" --add-label needs-review || true
            exit 0
          fi
          NON_STATE=$(printf '%s\n' "$FILES" \
            | grep -vcE '^data/monitor-state\.json(\.backup)?$|^reports/monitoring/.*\.md$' || true)
          if [ "${NON_STATE:-1}" != "0" ]; then
            echo "::warning::PR #$NEW_PR contains non-state file(s) (count=${NON_STATE:-unknown}); skipping auto-merge (manual review required)."
            gh pr edit "$NEW_PR" --add-label needs-review || true
            exit 0
          fi
          # Enable auto-merge FIRST; only drop the needs-review label once that
          # succeeds, so a failed `gh pr merge` (e.g. repo auto-merge disabled)
          # leaves the PR visibly needs-review instead of open + unlabeled + stuck.
          if gh pr merge "$NEW_PR" --auto --squash --delete-branch; then
            gh pr edit "$NEW_PR" --remove-label needs-review || true
            echo "Auto-merge enabled for state-only regulatory PR #$NEW_PR (merges once required checks pass)."
          else
            echo "::warning::Could not enable auto-merge for PR #$NEW_PR; leaving needs-review for manual handling."
            gh pr edit "$NEW_PR" --add-label needs-review || true
          fi
