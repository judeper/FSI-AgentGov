# Manual-dispatch workflow to regenerate Linux-baseline Playwright PNG snapshots.
#
# Usage: GitHub UI → Actions → "Update Playwright Snapshots" → Run workflow.
# Snapshots must only be generated on Linux to keep PNG diffs deterministic.
# Do NOT regenerate snapshots on Windows or macOS.
name: Update Playwright Snapshots

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  update-snapshots:
    runs-on: ubuntu-latest
    # Pin must match @playwright/test in package.json (-noble to match e2e.yml's
    # test distro). Enforced by scripts/check_playwright_pin_drift.py.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - name: Verify a PR exists for this branch
        # Snapshot regen writes binary PNGs; require an open PR so the diff
        # has a review surface and we never silently mutate main.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "ERROR: Refusing to regenerate snapshots directly on main."
            exit 1
          fi
          pr_count=$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq 'length' || echo 0)
          if [ "${pr_count}" -lt 1 ]; then
            echo "ERROR: No open PR found for branch ${GITHUB_REF_NAME}."
            echo "Open a draft PR before regenerating snapshots."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install MkDocs and docs plugins
        run: pip install -r requirements-docs.txt

      - name: Build docs site
        run: mkdocs build --strict

      - name: Regenerate Playwright snapshots
        run: npm run test:e2e:snapshots -- --update-snapshots

      - name: Upload snapshot diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-snapshot-diff
          path: |
            test-results/
            tests/e2e/**/*-snapshots/
          if-no-files-found: warn
          retention-days: 14
