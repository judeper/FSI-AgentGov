name: Autodoc Verify

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to verify
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  autodoc-verify:
    name: autodoc-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted base verifier
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve PR metadata (API only)
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr || '' }}
          EVENT_PR: ${{ github.event.pull_request.number || '' }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .autodoc
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$INPUT_PR"
          else
            PR_NUMBER="$EVENT_PR"
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "Unable to determine pull request number." >&2
            exit 1
          fi

          gh api "repos/$REPO/pulls/$PR_NUMBER" > .autodoc/pr-meta.json
          gh api "repos/$REPO/issues/$PR_NUMBER/labels?per_page=100" > .autodoc/pr-labels.json
          python scripts/autodoc_workflow.py \
            --pr-json .autodoc/pr-meta.json \
            --labels-json .autodoc/pr-labels.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Shim success for non-autodoc PRs
        if: steps.meta.outputs.is_autodoc != 'true'
        run: |
          echo "non-autodoc PR; shim success"

      - name: Refuse autodoc PRs while disabled
        if: steps.meta.outputs.is_autodoc == 'true' && vars.AUTODOC_ENABLED != 'true'
        run: |
          echo "Autodoc PRs must not exist while AUTODOC_ENABLED is not 'true'." >&2
          exit 1

      - name: Refuse forked autodoc PRs
        if: steps.meta.outputs.is_autodoc == 'true' && vars.AUTODOC_ENABLED == 'true' && steps.meta.outputs.head_repo != github.repository
        run: |
          echo "Autodoc verification only supports same-repository autodoc/* or copilot/* PRs." >&2
          exit 1

      - name: Set up Python
        if: steps.meta.outputs.is_autodoc == 'true' && vars.AUTODOC_ENABLED == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install verifier dependencies
        if: steps.meta.outputs.is_autodoc == 'true' && vars.AUTODOC_ENABLED == 'true'
        run: pip install -r scripts/requirements.txt

      - name: Extract contract and preflight changed paths (API only)
        id: contract
        if: steps.meta.outputs.is_autodoc == 'true' && vars.AUTODOC_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p .autodoc
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path

          from scripts import autodoc_workflow as workflow

          def _gh_json(endpoint: str) -> dict:
              completed = subprocess.run(["gh", "api", endpoint], check=True, capture_output=True, text=True)
              return json.loads(completed.stdout)

          repo = os.environ["REPO"]
          work = Path(".autodoc")
          pr = json.loads((work / "pr-meta.json").read_text(encoding="utf-8"))
          base_sha = pr["base"]["sha"]
          head_sha = pr["head"]["sha"]
          pr_body = pr.get("body") or ""
          (work / "pr-body.txt").write_text(pr_body, encoding="utf-8")
          trusted = workflow.derive_trusted_contract(pr_body, repo_root=".")
          contract = trusted["contract"]
          report_path = str(trusted["report_path"])
          fingerprint = str(trusted["fingerprint"])
          route = str(trusted["route"])

          compare = _gh_json(f"repos/{repo}/compare/{base_sha}...{head_sha}")
          changed_files = compare.get("files", [])
          if len(changed_files) >= 300:
              raise SystemExit("Changed-file preflight reached the GitHub compare file-list cap; failing closed.")
          fetch_paths = workflow.preflight_changed_files(changed_files, contract)

          (work / "contract.json").write_text(json.dumps(contract, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (work / "changed-files.json").write_text(json.dumps(fetch_paths, indent=2) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"report_path={report_path}\n")
              handle.write(f"route={route}\n")
              handle.write(f"base_sha={base_sha}\n")
              handle.write(f"head_sha={head_sha}\n")
          print(
              f"Trusted contract fingerprint {fingerprint} route={route}; "
              f"{len(fetch_paths)} changed file(s) passed preflight."
          )
          PY

      - name: Fetch diff and allowed PR head markdown files
        if: steps.meta.outputs.is_autodoc == 'true' && vars.AUTODOC_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ steps.contract.outputs.base_sha }}
          HEAD_SHA: ${{ steps.contract.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github.v3.diff" "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" > .autodoc/pr.diff
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import shutil
          import subprocess
          import urllib.parse
          from pathlib import Path

          repo = os.environ["REPO"]
          head_sha = os.environ["HEAD_SHA"]
          paths = json.loads(Path(".autodoc/changed-files.json").read_text(encoding="utf-8"))
          head_dir = Path(".autodoc/head")
          if head_dir.exists():
              shutil.rmtree(head_dir)
          head_dir.mkdir(parents=True)

          verifier_script = head_dir / "scripts" / "verify_language_rules.py"
          verifier_script.parent.mkdir(parents=True)
          shutil.copyfile(Path("scripts/verify_language_rules.py"), verifier_script)

          for path in paths:
              encoded_path = urllib.parse.quote(path, safe="/")
              endpoint = f"repos/{repo}/contents/{encoded_path}?ref={urllib.parse.quote(head_sha, safe='')}"
              completed = subprocess.run(
                  ["gh", "api", "-H", "Accept: application/vnd.github.raw", endpoint],
                  check=True,
                  capture_output=True,
              )
              target = head_dir / Path(*path.split("/"))
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(completed.stdout)
              print(f"Fetched {path} from PR head via Contents API.")
          PY

      - name: Run autodoc verify gate
        id: gate
        if: steps.meta.outputs.is_autodoc == 'true' && vars.AUTODOC_ENABLED == 'true'
        run: |
          set +e
          python scripts/autodoc_verify_gate.py \
            --contract .autodoc/contract.json \
            --report "${{ steps.contract.outputs.report_path }}" \
            --diff .autodoc/pr.diff \
            --head-dir .autodoc/head \
            --pr-body .autodoc/pr-body.txt \
            --out .autodoc/gate.json
          CODE=$?
          set -e
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate GitHub App token for escalation writes
        id: app-token
        if: steps.meta.outputs.is_autodoc == 'true' && vars.AUTODOC_ENABLED == 'true' && steps.gate.outputs.exit_code == '2'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-issues: write

      - name: Refuse silent escalation when write token is unavailable
        if: steps.meta.outputs.is_autodoc == 'true' && vars.AUTODOC_ENABLED == 'true' && steps.gate.outputs.exit_code == '2' && steps.app-token.outputs.token == ''
        run: |
          echo "Autodoc requires human review, but the escalation write token could not be created; no label or comment was written." >&2
          exit 1

      - name: Label and comment for human review
        if: steps.meta.outputs.is_autodoc == 'true' && vars.AUTODOC_ENABLED == 'true' && steps.gate.outputs.exit_code == '2' && steps.app-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.meta.outputs.pr }}
        run: |
          set -euo pipefail
          gh label create "needs-review" --color fbca04 --description "Needs human review" || true
          python - <<'PY'
          import json
          from pathlib import Path

          gate = json.loads(Path(".autodoc/gate.json").read_text(encoding="utf-8"))
          body = "\n".join(
              [
                  "Autodoc verification needs human review.",
                  "",
                  f"Summary: {gate.get('summary', 'No summary available.')}",
                  "",
                  "The autodoc-verify check fails closed until a human reviews this PR.",
              ]
          )
          Path(".autodoc/needs-human-comment.md").write_text(body + "\n", encoding="utf-8")
          PY
          gh issue comment "$PR_NUMBER" --body-file .autodoc/needs-human-comment.md
          gh issue edit "$PR_NUMBER" --add-label "needs-review"

      - name: Enforce gate result
        if: steps.meta.outputs.is_autodoc == 'true' && vars.AUTODOC_ENABLED == 'true'
        env:
          EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
        run: |
          # This pull_request_target gate runs from the base ref and does not
          # execute PR code, so it is safe as a branch-protection required check.
          if [ "$EXIT_CODE" = "0" ]; then
            echo "autodoc-verify passed"
            exit 0
          fi
          echo "autodoc-verify failed with gate exit code $EXIT_CODE" >&2
          exit "$EXIT_CODE"
