name: Publish Docs
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Block internal artifacts under docs/
        shell: bash
        run: |
          set -euo pipefail

          # Check both reference/ (legacy) and controls/ (new structure)
          forbidden=$(find docs/reference docs/controls -maxdepth 1 -type f \( -name '*.pdf' -o -name '*.txt' -o -name '*.json' \) -print 2>/dev/null || true)
          if [[ -n "${forbidden}" ]]; then
            echo "ERROR: Forbidden maintainer-only artifacts found under docs/reference or docs/controls (must be local-only):"
            echo "${forbidden}"
            exit 1
          fi

          for path in docs/HANDOFF.md docs/implementation-plan.md docs/getting-started/structure.md; do
            if [[ -f "${path}" ]]; then
              echo "ERROR: Maintainer-only doc must not exist under docs/: ${path}"
              exit 1
            fi
          done
      
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
          
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      
      - uses: actions/cache@v6
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
            
      - name: Install MkDocs and Material Theme
        run: pip install -r requirements-docs.txt

      - name: Validate Control Structure
        run: python scripts/verify_controls.py

      - name: Validate Language Rules
        run: python scripts/verify_language_rules.py

      - name: Generate Assessment Data
        run: python scripts/extract_assessment_data.py

      - name: Validate Documentation
        run: mkdocs build --strict

      - name: Verify built site output completeness
        run: python scripts/verify_build_output.py site

      - name: Verify mkdocs.yml site_url is explicit (defense-in-depth)
        shell: bash
        run: |
          set -euo pipefail
          expected='https://judeper.github.io/FSI-AgentGov/'
          # Match either `site_url: https://...` or `site_url: "https://..."` at start of line
          if ! grep -E "^site_url:[[:space:]]+\"?${expected}\"?[[:space:]]*$" mkdocs.yml >/dev/null; then
            echo "ERROR: mkdocs.yml must contain explicit 'site_url: ${expected}' at top level"
            grep -nE '^site_url:' mkdocs.yml || echo "(no site_url line found)"
            exit 1
          fi
          echo "site_url OK: ${expected}"

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
