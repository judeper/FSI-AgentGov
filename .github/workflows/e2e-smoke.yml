name: E2E Smoke

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'overrides/**'
      - 'mkdocs.yml'
      - '.github/workflows/e2e-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'overrides/**'
      - 'mkdocs.yml'
      - '.github/workflows/e2e-smoke.yml'

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install MkDocs and Material Theme
        run: pip install 'mkdocs-material>=9.5,<10'

      - name: Generate Assessment Data
        run: python scripts/extract_assessment_data.py

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke specs
        env:
          CI: '1'
        run: npx playwright test --grep @smoke --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
