name: Python Quality

on:
  pull_request:
    paths:
      - 'assessment/**'
      - 'scripts/**'
      - 'docs/controls/CONTROL-INDEX.md'
      - 'docs/reference/assessment-coverage.md'
      - 'docs/reference/pattern-coverage.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'ruff.toml'
      - '.github/workflows/python-quality.yml'
      - '.github/workflows/required-check-shims.yml'
      # Any workflow change can affect CI behavior. Trigger python-quality on
      # every workflow edit so the required-check gate is always satisfied,
      # not just when the change happens to touch this file or the shims.
      # See hotfix #267 for the gap that motivated this filter expansion.
      - '.github/workflows/**'
      # Version-stamp gate (verify_version_stamps job) needs to run when any
      # canonical-version surface changes, even if no Python/scripts changed.
      - 'VERSION'
      # CHANGELOG.md must trigger python-quality so the 5 required-check
      # named jobs report on changelog-only PRs (otherwise branch protection
      # blocks with "11 of 11 expected" because verify_version_stamps, ruff,
      # pytest, manifest drift, and FSI language rules never trigger). The
      # quality jobs are fast (~30s) so the marginal CI cost is acceptable.
      - 'CHANGELOG.md'
      - 'README.md'
      - 'DISCLAIMER.md'
      - 'docs/disclaimer.md'
      - 'docs/framework/**'
      - 'docs/reference/regulatory-mappings.md'
      - 'docs/reference/solutions-index.md'
      - 'docs/index.md'
      - 'AGENTS.md'
      - 'assessment/data/solutions-lock.json'
      - 'docs/**/*.md'
      # Control Explorer data drift check (check_explorer_data_drift.py) must
      # fire when the generated dataset or its generator inputs change, even
      # if no control .md changed (e.g. a hand-edit to control-explorer-data.json
      # or the Explorer JS/CSS assets).
      - 'docs/javascripts/**'
      # Use the whole data/** tree, not just data/monitor-state.json. A
      # baseline-advance PR also stages data/monitor-state.json.backup and
      # data/monitor-pending/learn/*.json; a pending-blob-only or backup-only
      # diff would otherwise drop the 5 named required checks and wedge the PR.
      - 'data/**'
      # npm Dependabot PRs only change package.json / package-lock.json,
      # which none of the 5 python-quality check names cover.  Without this
      # entry, branch protection blocks those PRs with "6 of 11 expected"
      # because the required check names never fire.  Same rationale as the
      # CHANGELOG.md entry above — quality jobs are fast (~30s).
      - 'package.json'
      - 'package-lock.json'
      # Required-check coverage gate (mirrors pull_request paths above): see
      # comment on tests/** under pull_request.paths.
      - 'tests/**'
      # Instruction files (.github/instructions/**) are governance tooling that
      # do not trigger e2e-smoke or docs-validation but DO need the python-quality
      # gate so that instruction-only PRs satisfy all 11 required branch-protection
      # checks. The shim (required-check-shims.yml) already covers e2e-smoke and
      # mkdocs-strict for these PRs; this entry covers ruff, pytest, drift,
      # language-rules, and verify_version_stamps.
      - '.github/instructions/**'
      # Squad governance files require python-quality gate so that squad-only PRs
      # satisfy all 11 required branch-protection checks. Same rationale as instructions.
      - '.squad/**'
      # The repo-level Copilot instructions file is governance tooling (like
      # .github/instructions/** and AGENTS.md). copilot-instructions.md-only PRs
      # otherwise block with "6 of 11 expected" because the python-quality named
      # checks (ruff, pytest, drift, language-rules, verify_version_stamps) never fire.
      - '.github/copilot-instructions.md'
      # playwright.config.mjs and overrides/** trigger e2e-smoke/mkdocs-strict (real or shim)
      # but were missing from python-quality's paths, so a PR touching only one would block with
      # the 5 named checks "expected" yet never reported. Mirror them here to close that deadlock.
      - 'playwright.config.mjs'
      - 'overrides/**'
  push:
    branches:
      - main
    paths:
      - 'assessment/**'
      - 'scripts/**'
      - 'docs/controls/CONTROL-INDEX.md'
      - 'docs/reference/assessment-coverage.md'
      - 'docs/reference/pattern-coverage.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'ruff.toml'
      - '.github/workflows/python-quality.yml'
      - '.github/workflows/required-check-shims.yml'
      # Any workflow change can affect CI behavior — mirror pull_request.paths.
      - '.github/workflows/**'
      - 'VERSION'
      - 'README.md'
      - 'DISCLAIMER.md'
      - 'docs/disclaimer.md'
      - 'docs/framework/**'
      - 'docs/reference/regulatory-mappings.md'
      - 'docs/reference/solutions-index.md'
      - 'docs/index.md'
      - 'AGENTS.md'
      - 'assessment/data/solutions-lock.json'
      - 'docs/**/*.md'
      - 'docs/javascripts/**'
      # Mirror pull_request.paths: whole data/** tree (backup + pending blobs).
      - 'data/**'
      - 'tests/**'
      - '.github/copilot-instructions.md'
      - 'playwright.config.mjs'
      - 'overrides/**'

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (assessment + scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r assessment/requirements.txt
          pip install -r scripts/requirements.txt
          pip install pytest
      - name: Run assessment tests
        run: pytest assessment/tests -v
      - name: Run scripts tests
        run: |
          # Collect-only scripts/test_*.py; some require optional deps so we
          # tolerate skipped tests but fail on real failures.
          # AS22: removed `|| echo` swallow so future regressions turn CI red.
          # Post-audit follow-up (commit fixing test_zone_2_remediation_case_
          # insensitive_everyone): the broken test wrongly expected substring
          # matching against the system-name set; production code intentionally
          # uses exact-matching to avoid stripping legitimate groups whose
          # names contain words like "public" or "all" as substrings (e.g.
          # "Republic Team", "Public Sector Solutions"). The test now uses
          # exact-match inputs ("Public" instead of "public users") plus a
          # companion test that asserts the substring-preservation invariant.
          # The --deselect line that was here is no longer needed.
          pytest scripts -v -p no:cacheprovider --ignore=scripts/private \
            --ignore=scripts/governance \
            -k "test_"

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install 'ruff>=0.5'
      - run: ruff check assessment scripts

  drift:
    name: manifest / index / nav drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify control doc structure
        run: python scripts/verify_controls.py
      - name: Verify control cross-reference graph
        run: python scripts/verify_xref_graph.py
      - name: Check control IDs in manifest, CONTROL-INDEX, and mkdocs nav
        run: python scripts/check_manifest_doc_drift.py --check
      - name: Check Control Explorer data is regenerated from source
        run: python scripts/check_explorer_data_drift.py --check
      - name: Check Change Radar feed data is regenerated and language-clean
        run: python scripts/check_change_radar_data_drift.py --check
      - name: Check FAQ JSON-LD matches the visible FAQ page
        run: python scripts/check_faq_jsonld_drift.py --check
      - name: Check assessment coverage matrix is up to date
        run: python scripts/generate_coverage_matrix.py --check
      - name: Install pyyaml for pattern coverage script
        run: pip install -r scripts/requirements.txt
      - name: Check pattern coverage matrix is up to date
        run: |
          git clone --depth 1 https://github.com/judeper/FSI-AgentGov-Solutions.git /tmp/fsi-agentgov-solutions
          python scripts/generate_pattern_coverage.py --solutions-repo /tmp/fsi-agentgov-solutions --check

  language-rules:
    name: FSI language rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python scripts/verify_language_rules.py

  learn_urls_count:
    name: Microsoft Learn URL count drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify prose URL counts match actual count in microsoft-learn-urls.md
        run: python scripts/verify_learn_urls_count.py --check

  verify_version_stamps:
    name: verify_version_stamps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify framework version stamps match canonical (VERSION)
        run: python scripts/verify_version_stamps.py --check

  prose_counts:
    name: prose-counts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify solution and regulatory prose counts match canonical sources
        run: python scripts/verify_prose_counts.py --check
      - name: Verify solution docs consume the pinned solutions lock contract
        run: python scripts/verify_solutions_docs.py --check

  regulatory_naming:
    name: regulatory naming (OCC/SR canonical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify OCC/SR canonical naming on summary surfaces
        run: python scripts/verify_regulatory_naming.py --check

  learn_url_health:
    name: Microsoft Learn URL health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify no Microsoft Learn URLs are dead (404/410/451)
        run: python scripts/verify_learn_url_health.py
