name: Python Quality

on:
  pull_request:
    paths:
      - 'assessment/**'
      - 'scripts/**'
      - 'docs/controls/CONTROL-INDEX.md'
      - 'docs/reference/assessment-coverage.md'
      - 'docs/reference/pattern-coverage.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'ruff.toml'
      - '.github/workflows/python-quality.yml'
      # Version-stamp gate (verify_version_stamps job) needs to run when any
      # canonical-version surface changes, even if no Python/scripts changed.
      - 'VERSION'
      - 'README.md'
      - 'DISCLAIMER.md'
      - '.claude/claude.md'
      - 'docs/disclaimer.md'
      - 'docs/framework/**'
      # Prose-counts gate (verify_prose_counts job) needs to run when any
      # solution-count or regulatory-mappings surface changes, even if no
      # Python/scripts changed.
      - 'docs/reference/regulatory-mappings.md'
      - 'docs/reference/solutions-index.md'
      - 'docs/index.md'
      - 'AGENTS.md'
      - '.github/agents/gsd-codebase-mapper.agent.md'
      - 'assessment/data/solutions-lock.json'
      # Regulatory-naming gate (regulatory_naming job) — full docs/ corpus.
      # Triggers on ANY docs/ markdown change (the verifier scans all of
      # docs/ excluding the local-only docs/images/ checklists).
      - 'docs/**/*.md'
      # Learn URL health gate (learn_url_health job) — fail when any
      # Microsoft Learn URL has gone 404/410/451.
      - 'data/monitor-state.json'
  push:
    branches:
      - main
    paths:
      - 'assessment/**'
      - 'scripts/**'
      - 'docs/controls/CONTROL-INDEX.md'
      - 'docs/reference/assessment-coverage.md'
      - 'docs/reference/pattern-coverage.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'ruff.toml'
      - '.github/workflows/python-quality.yml'
      - 'VERSION'
      - 'README.md'
      - 'DISCLAIMER.md'
      - '.claude/claude.md'
      - 'docs/disclaimer.md'
      - 'docs/framework/**'
      - 'docs/reference/regulatory-mappings.md'
      - 'docs/reference/solutions-index.md'
      - 'docs/index.md'
      - 'AGENTS.md'
      - '.github/agents/gsd-codebase-mapper.agent.md'
      - 'assessment/data/solutions-lock.json'
      - 'docs/**/*.md'
      - 'data/monitor-state.json'

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (assessment + scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r assessment/requirements.txt
          pip install -r scripts/requirements.txt
          pip install pytest
      - name: Run assessment tests
        run: pytest assessment/tests -v
      - name: Run scripts tests
        run: |
          # Collect-only scripts/test_*.py; some require optional deps so we
          # tolerate skipped tests but fail on real failures.
          pytest scripts -v -p no:cacheprovider --ignore=scripts/private \
            --ignore=scripts/governance \
            -k "test_" || echo "scripts pytest exit=$?"

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install 'ruff>=0.5'
      - run: ruff check assessment scripts

  drift:
    name: manifest / index / nav drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check control IDs in manifest, CONTROL-INDEX, and mkdocs nav
        run: python scripts/check_manifest_doc_drift.py --check
      - name: Check assessment coverage matrix is up to date
        run: python scripts/generate_coverage_matrix.py --check
      - name: Install pyyaml for pattern coverage script
        run: pip install -r scripts/requirements.txt
      - name: Check pattern coverage matrix is up to date
        run: |
          git clone --depth 1 https://github.com/judeper/FSI-AgentGov-Solutions.git /tmp/fsi-agentgov-solutions
          python scripts/generate_pattern_coverage.py --solutions-repo /tmp/fsi-agentgov-solutions --check

  language-rules:
    name: FSI language rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python scripts/verify_language_rules.py

  learn_urls_count:
    name: Microsoft Learn URL count drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify prose URL counts match actual count in microsoft-learn-urls.md
        run: python scripts/verify_learn_urls_count.py --check

  verify_version_stamps:
    name: verify_version_stamps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify framework version stamps match canonical (VERSION)
        run: python scripts/verify_version_stamps.py --check

  prose_counts:
    name: prose-counts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify solution and regulatory prose counts match canonical sources
        run: python scripts/verify_prose_counts.py --check

  regulatory_naming:
    name: regulatory naming (OCC/SR canonical)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify OCC/SR canonical naming on summary surfaces
        run: python scripts/verify_regulatory_naming.py --check

  learn_url_health:
    name: Microsoft Learn URL health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify no Microsoft Learn URLs are dead (404/410/451)
        run: python scripts/verify_learn_url_health.py
