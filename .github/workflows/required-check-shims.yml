# Required-check shim: e2e-smoke (branch protection).
#
# Branch protection requires `e2e-smoke` and `mkdocs-strict` as required
# status checks with enforce_admins on (no bypass). The real workflows use
# `paths:` filters, so PRs that touch none of those paths (bot PRs, data-only
# PRs, CHANGELOG-only PRs, etc.) never trigger them and can never satisfy
# branch protection. These shims report success for the matching check name
# precisely when the real workflow would NOT fire, so the required context is
# always reported and the merge is not wedged.
#
# WHY TWO SEPARATE SHIM FILES (one required check per file):
#   A workflow has a single `on:` trigger, so a single file cannot carry two
#   different `paths-ignore` blocks. The two real workflows have DIFFERENT
#   `paths:` lists, so a single shared `paths-ignore` (the union of both) is
#   not an exact complement of either — it over-includes paths and reopens the
#   deadlock. Each shim therefore lives in its own file and its `paths-ignore`
#   equals the EXACT `paths:` of its own real workflow:
#
#     this file (e2e-smoke shim)        -> mirrors e2e-smoke.yml `paths:`
#     required-check-shim-mkdocs.yml    -> mirrors docs-validation.yml `paths:`
#
# EXACT COMPLEMENT MAPPING — keep these in lockstep with the real workflows:
#
#   e2e-smoke.yml `paths:` (mirrored below as paths-ignore):
#     docs/**, tests/e2e/**, playwright.config.mjs, package.json,
#     package-lock.json, overrides/**, mkdocs.yml, .github/workflows/**
#
#   docs-validation.yml (job mkdocs-strict) `paths:` (mirrored in the sibling):
#     docs/**, mkdocs.yml, overrides/**, VERSION, scripts/verify_build_output.py,
#     .github/workflows/**, tests/**, package.json, package-lock.json
#
# COMPLEMENT GUARANTEE (per required check, per PR):
#   - PR where every changed file matches the real `paths:`  -> real fires, shim skips.
#   - PR where no changed file matches the real `paths:`     -> real skips, shim fires.
#   So neither-fires (the deadlock) is impossible. A MIXED PR (some files in the
#   real `paths:`, some not) fires BOTH the real workflow and the shim; this is
#   benign for green runs but, because GitHub evaluates the latest run for a
#   given check name, an always-success shim completing after a failed real run
#   could mask that failure. Keep the shim cheap and exact; do not widen its
#   `paths-ignore` beyond the real workflow's `paths:`.
#
# When you add/remove a path in e2e-smoke.yml's `paths:`, mirror it in this
# file's `paths-ignore:` (and the same for docs-validation.yml in the sibling)
# in the same commit.

name: Required check shim - e2e-smoke

on:
  pull_request:
    # Exact mirror of e2e-smoke.yml `paths:`. The shim fires only when the real
    # e2e-smoke workflow would NOT (no listed path changed).
    paths-ignore:
      - 'docs/**'
      - 'tests/e2e/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'overrides/**'
      - 'mkdocs.yml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Skip (no e2e-smoke paths changed)
        run: |
          echo "Real e2e-smoke workflow did not trigger because none of its"
          echo "paths (docs/**, tests/e2e/**, playwright.config.mjs,"
          echo "package.json, package-lock.json, overrides/**, mkdocs.yml,"
          echo ".github/workflows/**) changed in this PR."
          echo "Reporting success to satisfy the required-check gate."
