name: sri-check

on:
  pull_request:
    paths:
      - docs/javascripts/lib/**
      - docs/javascripts/vendor/**
      - docs/javascripts/assessment-app.js
      - docs/javascripts/assessment-loader.js
      - overrides/main.html
      - scripts/verify-sheetjs-sri.mjs
      - scripts/verify-fast-uri-artifact.mjs
      - scripts/verify-vendored-runtime.mjs
      - vendor/npm/fast-uri/**
      - package.json
      - package-lock.json
      - .github/workflows/sri-check.yml
  push:
    branches:
      - main
    paths:
      - docs/javascripts/lib/**
      - docs/javascripts/vendor/**
      - docs/javascripts/assessment-app.js
      - docs/javascripts/assessment-loader.js
      - overrides/main.html
      - scripts/verify-sheetjs-sri.mjs
      - scripts/verify-fast-uri-artifact.mjs
      - scripts/verify-vendored-runtime.mjs
      - vendor/npm/fast-uri/**
      - package.json
      - package-lock.json
      - .github/workflows/sri-check.yml

jobs:
  sri-check:
    name: sri-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify all vendored library SRI literals match on-disk files
        run: node scripts/verify-sheetjs-sri.mjs

      - name: Verify reviewed vendored dependency policies
        run: node scripts/verify-vendored-runtime.mjs
