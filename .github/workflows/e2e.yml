name: e2e

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/e2e/**'
      - 'tests/spa/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'overrides/**'
      - 'mkdocs.yml'
      - '.github/workflows/e2e.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'docs/**'
      - 'tests/e2e/**'
      - 'tests/spa/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'overrides/**'
      - 'mkdocs.yml'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily, full suite on main
  workflow_dispatch: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-full:
    name: e2e-full
    # Skip on PRs unless they have the 'run-full-e2e' label.
    # Always run on push to main, scheduled, or manual dispatch.
    if: |
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-full-e2e'))
    runs-on: ubuntu-latest
    # Pinned to match @playwright/test version in package.json exactly.
    # Browsers are pre-installed in the container, avoiding `npx playwright install`.
    # Enforced by scripts/check_playwright_pin_drift.py (required "drift" job) so a
    # future Dependabot bump can't silently skew this image vs the client again (#583).
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --user 1001
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # Mirror smoke workflow's mkdocs install for consistency.
      # Pip install of mkdocs-material typically completes in <60s in this container.
      # Use `python -m pip` because actions/setup-python doesn't update PATH
      # inside the Playwright container (only sets pythonLocation env).
      - name: Install MkDocs and docs plugins
        run: python -m pip install -r requirements-docs.txt

      - name: Generate Assessment Data
        run: python scripts/extract_assessment_data.py

      - run: npm ci

      - name: Run full E2E suite
        env:
          CI: '1'
          PW_PORT: '8765'
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-full
          path: playwright-report/
          retention-days: 14

      - name: Upload trace artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # Visibility net for main: e2e-full is NOT a required check (it is label-gated
  # off PRs), so a failure on main would otherwise sit unnoticed. On a failed
  # main `push` or the daily `schedule` run, file (or update) a single deduped
  # issue instead of letting the red run go unseen. PR/dispatch failures are
  # surfaced by the run itself and are intentionally excluded.
  notify-e2e-failure:
    name: notify-e2e-failure
    needs: e2e-full
    if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the e2e-full-broken issue
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout step, so gh must be told the repo explicitly.
          # Without it every gh call fails with "fatal: not a git repository" and the
          # alert issue is never filed (the whole point of this visibility net).
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          LABEL="e2e-full-broken"
          # Ensure the dedup label exists (first run creates it; ignore if present).
          gh label create "$LABEL" --color B60205 \
            --description "e2e-full is failing on main (auto-filed by e2e.yml)" 2>/dev/null || true
          BODY=$(printf 'e2e-full failed on `main` (event: `%s`).\n\n- Commit: `%s`\n- Run: %s\n\ne2e-full is not a required check (it is label-gated off PRs), so this issue is the visibility net for main breakage. Investigate the run, fix forward, then close this issue — it is reused (commented) on subsequent failures, not duplicated.\n' "$EVENT" "$SHA" "$RUN_URL")
          # Idempotent: reuse an existing open issue if present; never spam duplicates.
          EXISTING=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            if ! gh issue edit "$EXISTING" --add-assignee "$REPO_OWNER"; then
              echo "::warning::Failed to assign @$REPO_OWNER on existing #$EXISTING; continuing."
            fi
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Commented on existing #$EXISTING"
          else
            NEW_URL=$(gh issue create --title "e2e-full failing on main" --label "$LABEL" --body "$BODY")
            NEW_NUMBER="${NEW_URL##*/}"
            echo "Created new e2e-full-broken issue: $NEW_URL"
            if [[ "$NEW_NUMBER" =~ ^[0-9]+$ ]]; then
              if ! gh issue edit "$NEW_NUMBER" --add-assignee "$REPO_OWNER"; then
                echo "::warning::Failed to assign @$REPO_OWNER on new #$NEW_NUMBER; continuing."
              fi
            else
              echo "::warning::Could not parse issue number from '$NEW_URL'; skipping assignment."
            fi
          fi

  close-e2e-failure-on-recovery:
    name: close-e2e-failure-on-recovery
    needs: e2e-full
    if: needs.e2e-full.result == 'success' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Comment and close e2e-full-broken issue on green run
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout step, so gh must be told the repo explicitly.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LABEL="e2e-full-broken"
          EXISTING=$(gh issue list --state open --label "$LABEL" --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            echo "No open $LABEL issue found; nothing to close."
            exit 0
          fi
          BODY=$(printf 'e2e-full recovered on `main`.\n\n- Commit: `%s`\n- Run: %s\n\nClosing this visibility issue. A future failed `push` or `schedule` run will reopen the alert flow.\n' "$SHA" "$RUN_URL")
          gh issue comment "$EXISTING" --body "$BODY"
          gh issue close "$EXISTING"
          echo "Commented and closed #$EXISTING"
