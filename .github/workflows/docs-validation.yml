name: docs-validation

# PR-time validation gate for the MkDocs site. Mirrors the build steps in
# publish_docs.yml so the site is proven to build with --strict before merge,
# not just at deploy time. Required check name (for branch protection): mkdocs-strict.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'VERSION'
      - 'scripts/verify_build_output.py'
      - '.github/workflows/**'
      # Required-check coverage gate: mkdocs-strict is a required check by
      # branch protection. Playwright specs (tests/**) often reference docs
      # pages by URL; if a docs page is removed or renamed, an e2e spec that
      # links to it should be caught at PR-time, not after merge. See PR #256
      # for the gap that motivated this filter addition. The .github/workflows/**
      # entry (May 2026, sibling PR to e2e-smoke widening) closes the
      # workflow-PR coverage gap that left mkdocs-strict missing on
      # Dependabot/workflow-only PRs.
      - 'tests/**'
      # npm Dependabot PRs only change package.json / package-lock.json.
      # Without this entry, mkdocs-strict never fires on those PRs and
      # branch protection blocks the merge.  The build is fast (~30s) and
      # npm changes cannot break MkDocs, so the marginal cost is trivial.
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mkdocs-strict:
    name: mkdocs-strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache MkDocs build cache
        uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ hashFiles('mkdocs.yml') }}-${{ github.run_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-${{ hashFiles('mkdocs.yml') }}-
            mkdocs-material-

      - name: Install MkDocs and Material Theme
        run: pip install -r requirements-docs.txt

      - name: Build documentation (strict)
        run: mkdocs build --strict

      - name: Verify built site output completeness
        # Closes U-038 — `mkdocs build --strict` can exit 0 while a widened
        # exclude_docs pattern or partial artifact step drops major route
        # families from site/. This asserts the expected subtrees + search
        # asset exist before downstream validators run.
        run: python scripts/verify_build_output.py site

      - name: Verify OpenGraph and Twitter Card meta tags on built site
        # Closes AS22 — verify_meta_tags.py was added in AS16 but never
        # wired into CI. Runs against the real site/ build (not synthetic
        # test strings) so OG/Twitter card metadata in overrides/main.html
        # has regression protection. Depends on the previous step having
        # populated site/.
        run: python scripts/verify_meta_tags.py site/

      - name: Verify built HTML has no broken internal links
        # Closes F-CI-GAP-ANCHOR-VALIDATOR-01,
        #        F-BUILD-CROSS-PLAYBOOK-DEPTH-BUG-01,
        #        F-BUILD-EXCLUDE-DOCS-DEAD-LINK-01.
        # mkdocs --strict only flags WARN-level link issues; cross-playbook
        # depth bugs and exclude_docs targets are silent today. This walks
        # site/**/*.html and validates every internal <a href>.
        run: python scripts/verify_doc_links.py site --json _broken-links.json

      - name: Upload broken-links report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: broken-links-report
          path: _broken-links.json
          if-no-files-found: ignore
