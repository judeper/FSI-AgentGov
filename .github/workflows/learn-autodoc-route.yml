name: Learn Autodoc Route

on:
  workflow_dispatch:
    inputs:
      report:
        description: Optional reports/monitoring/learn-changes-*.md path
        required: false
        type: string
  schedule:
    - cron: '30 7 * * *'
  pull_request:
    types: [closed]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: learn-autodoc-route
  cancel-in-progress: false

jobs:
  route-learn-autodoc:
    if: ${{ vars.AUTODOC_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'learn-watch'))) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Ensure routing labels exist
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh label create autodoc --color 1f883d --description "Autodoc routing issue" || true
          gh label create "squad:copilot" --color 8250df --description "Route issue to Copilot coding agent" || true
          gh label create escalate --color d1242f --description "Requires human escalation" || true
          gh label create "needs-review" --color fbca04 --description "Needs human review" || true
          gh label create monitoring --color 0969da --description "Monitoring automation" || true

      - name: Pick Learn report
        id: pick-report
        env:
          REPORT_INPUT: ${{ github.event.inputs.report || '' }}
        run: |
          set -euo pipefail
          if [ -n "$REPORT_INPUT" ]; then
            REPORT="$REPORT_INPUT"
          else
            REPORT=$(ls -t reports/monitoring/learn-changes-*.md 2>/dev/null | head -1 || true)
          fi

          if [ -z "$REPORT" ]; then
            echo "No Learn Monitor report found." >&2
            exit 1
          fi
          if [ ! -f "$REPORT" ]; then
            echo "Learn Monitor report does not exist: $REPORT" >&2
            exit 1
          fi

          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          echo "Selected report: $REPORT"

      - name: Run autodoc canary
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set +e
          CANARY_OUTPUT=$(python scripts/autodoc_canary.py 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$CANARY_OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            EXISTING_JSON=$(gh issue list --search "Autodoc canary failed pipeline halted in:title" --state open --json number --limit 1)
            EXISTING_NUMBER=$(python -c "import json,sys; data=json.load(sys.stdin); print(data[0]['number'] if data else '')" <<< "$EXISTING_JSON")
            if [ -z "$EXISTING_NUMBER" ]; then
              BODY_FILE=.autodoc-canary-failure.md
              {
                echo "Autodoc canary failed; the pipeline halted before routing Learn changes."
                echo
                echo '```text'
                printf '%s\n' "$CANARY_OUTPUT"
                echo '```'
              } > "$BODY_FILE"
              gh issue create --title "Autodoc canary failed — pipeline halted" --body-file "$BODY_FILE" --label escalate
              rm -f "$BODY_FILE"
            else
              echo "Existing canary failure issue #$EXISTING_NUMBER is open; not creating a duplicate."
            fi
            exit "$STATUS"
          fi

      - name: Build routing issue specs
        run: |
          python scripts/autodoc_route.py \
            --report "${{ steps.pick-report.outputs.report }}" \
            --ledger data/autodoc-ledger.json \
            --out routing.json

      - name: Create idempotent autodoc issues and update ledger
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          from datetime import UTC, datetime
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          import autodoc_route as route

          routing_path = Path("routing.json")
          ledger_path = Path("data/autodoc-ledger.json")
          body_dir = Path(".autodoc-issue-bodies")
          body_dir.mkdir(exist_ok=True)
          repo = os.environ["GITHUB_REPOSITORY"]

          def gh(*args: str) -> subprocess.CompletedProcess[str]:
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True)

          def issue_url(number: int) -> str:
              return f"https://github.com/{repo}/issues/{number}"

          def parse_issue_number(url: str) -> int:
              match = re.search(r"/issues/(\d+)\s*$", url)
              if not match:
                  raise ValueError(f"Could not parse issue number from gh output: {url!r}")
              return int(match.group(1))

          specs = json.loads(routing_path.read_text(encoding="utf-8"))
          ledger = route.load_ledger(ledger_path)
          changes = ledger.setdefault("changes", {})
          now = datetime.now(UTC).isoformat()

          for spec in specs:
              fingerprint = spec["fingerprint"]
              search = gh(
                  "issue", "list",
                  "--search", f"AUTODOC-FINGERPRINT:{fingerprint} in:body",
                  "--state", "all",
                  "--json", "number",
                  "--limit", "1",
              )
              existing = json.loads(search.stdout)
              if existing:
                  number = int(existing[0]["number"])
                  spec["issue_number"] = number
                  spec["issue_url"] = issue_url(number)
                  spec["issue_status"] = "existing"
                  changes[fingerprint] = {
                      "issue_number": number,
                      "issue_url": issue_url(number),
                      "route": spec["route"],
                      "automerge_eligible": spec["automerge_eligible"],
                      "labels": spec["labels"],
                      "status": "existing",
                      "updated_at": now,
                  }
                  print(f"Skipped existing issue #{number} for {fingerprint}")
                  continue

              body_path = body_dir / f"{fingerprint.replace(':', '-')}.md"
              body_path.write_text(spec["body"], encoding="utf-8")
              labels = list(spec["labels"])
              create_labels = [label for label in labels if label != "squad:copilot"]
              create_args = ["issue", "create", "--title", spec["title"], "--body-file", str(body_path)]
              for label in create_labels:
                  create_args.extend(["--label", label])

              created = gh(*create_args)
              url = created.stdout.strip().splitlines()[-1]
              number = parse_issue_number(url)
              if "squad:copilot" in labels:
                  gh("issue", "edit", str(number), "--add-label", "squad:copilot")

              spec["issue_number"] = number
              spec["issue_url"] = url
              spec["issue_status"] = "created"
              changes[fingerprint] = {
                  "issue_number": number,
                  "issue_url": url,
                  "route": spec["route"],
                  "automerge_eligible": spec["automerge_eligible"],
                  "labels": labels,
                  "status": "created",
                  "created_at": now,
              }
              print(f"Created issue #{number} for {fingerprint}")

          route.save_ledger(ledger_path, ledger)
          routing_path.write_text(json.dumps(specs, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          shutil.rmtree(body_dir, ignore_errors=True)
          created_count = sum(1 for spec in specs if spec.get("issue_status") == "created")
          existing_count = sum(1 for spec in specs if spec.get("issue_status") == "existing")
          print(f"Autodoc issue routing complete: created={created_count} existing={existing_count}")
          PY

      - name: Create ledger pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: |
            data/autodoc-ledger.json
            routing.json
          commit-message: |
            Autodoc: update routing ledger

            Records Learn autodoc issues created by learn-autodoc-route.
          branch: monitoring/autodoc-ledger-${{ github.run_number }}
          delete-branch: true
          title: Autodoc ledger update (${{ github.run_number }})
          body: |
            ## Autodoc ledger update

            This PR records issue routing output for `${{ steps.pick-report.outputs.report }}`.

            The routing workflow is gated by `AUTODOC_ENABLED == 'true'`.
          labels: |
            monitoring
