name: Trusted Dependency Artifact Preflight

# BASE-CONTROLLED, NON-ENFORCING PREFLIGHT
#
# This workflow file, the policy it reads, and the verifier it runs all come
# from the protected default branch and provide local evidence only. The
# pull-request-controlled `sri-check` workflow remains useful as fast
# supplemental feedback, but it can only ever attest to itself.
#
# This workflow is deliberately NOT the authoritative enforcement signal. A
# candidate can create a same-name GitHub Actions check on either a PR head or a
# test merge. The planned remote ruleset instead requires the
# `trusted-dependency-artifact` check from a dedicated GitHub App integration.
# See .github/trusted-policy/trusted-dependency-artifact-ruleset.plan.json.
#
# HARD RULES — every one of these is asserted by
# tests/spa/trusted-dependency-gate.test.mjs:
#
#   1. The candidate head and the candidate merge commit are NEVER checked out,
#      fetched into the workspace, merged, or executed. Only the immutable
#      pull-request base commit is checked out.
#   2. No npm, npx, package script, lifecycle hook or candidate JavaScript runs.
#      There is no `node_modules` directory in either job.
#   3. No dependency cache is restored, so there is no cache to poison.
#   4. No candidate-controlled value is interpolated into a `run:` body. Values
#      reach the scripts through `env:` only, and every one is re-validated
#      against a regular expression before use.
#   5. No `actions/github-script`, so there is no expression evaluator to abuse.
#   6. No artifact upload, so no job output can smuggle a token.
#   7. This workflow has no write scope. It cannot publish an authoritative
#      check and must never be configured as a name-only required check.
#
# `pull_request_target` runs trusted workflow code from the default branch. The
# checkout below is additionally fixed to the event's immutable base SHA so
# policy cannot drift during a run. See .github/TRUSTED-DEPENDENCY-GATE.md.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Deliberately empty at workflow level; each job opts in to the minimum it needs.
permissions: {}

concurrency:
  group: trusted-dependency-artifact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight:
    name: validate (immutable base policy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the immutable pull-request base only
        uses: actions/checkout@v7
        with:
          # Never the PR head or merge commit.
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node without any dependency cache
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Evaluate the candidate as data against immutable base policy
        env:
          GATE_REPOSITORY: ${{ github.repository }}
          GATE_PR_NUMBER: ${{ github.event.pull_request.number }}
          GATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GATE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GATE_TOKEN: ${{ github.token }}
        run: node scripts/trusted/verify-dependency-artifact-gate.mjs
